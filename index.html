<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Simulasi TKA Bahasa Inggris</title>
<style>
/* ===== Token ===== */
:root{
  --ink:#16307a; --ink-d:#0d2159; --ink-l:#e3e8f7;
  --desk:#e6ebe8; --paper:#ffffff; --line:#b9c3be; --line-2:#dbe2de;
  --text:#1c232b; --muted:#56616b;
  --mark:#ffd84a; --mark-d:#3a2b00; --mark-b:#c79f00;
  --ok:#1b7546; --ok-l:#dcf1e4; --bad:#b3261e; --bad-l:#f9e1de; --part:#8f5a00; --part-l:#fdefd1;
  --fs:1;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-read:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,"Noto Serif",serif;
}

/* ===== Dasar ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--text);font:16px/1.5 var(--font-ui)}
body.has-modal{overflow:hidden}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button,label,a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);font-weight:650;white-space:nowrap}
.btn:hover{background:var(--ink-l)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:var(--ink-d)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:active:not(:disabled){background:var(--ink-l)}
.btn.primary:active:not(:disabled){background:var(--ink-d)}
.opt:active,.pill:active{border-color:var(--ink)}
.cell:active{background:var(--ink-l)}
.btn.big{min-height:52px;width:100%;font-size:1.05rem}
.btn svg{flex:none}
.linkbtn{border:0;background:none;color:var(--ink);text-decoration:underline;padding:10px 0;font-weight:600}
.linkbtn:disabled{opacity:.35;cursor:default;text-decoration:none}

/* ===== Halaman awal ===== */
.start{max-width:1080px;margin:0 auto;padding:clamp(20px,4vw,56px) clamp(16px,4vw,32px) 64px}
.hero{margin-bottom:32px}
.school{font-weight:650;color:var(--ink);margin-bottom:8px}
.hero h1{font:700 clamp(2rem,5.4vw,3.5rem)/1.08 var(--font-read);letter-spacing:-.01em;max-width:15ch}
.lede{margin-top:14px;font-size:1.1rem;max-width:58ch;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:10px 32px;margin-top:22px}
.facts div{display:flex;flex-direction:column}
.facts dt{font-size:.85rem;color:var(--muted)}
.facts dd{font-weight:700;font-size:1.15rem}
.start-grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:860px){.start-grid{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--ink);border-radius:4px 4px 12px 12px;padding:22px;box-shadow:0 12px 28px -20px rgba(13,33,89,.55)}
.card h2{font-size:1.15rem;margin-bottom:14px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;min-height:46px;padding:0 12px;border:2px solid var(--line);border-radius:8px;background:#fff}
.field input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--ink-l)}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin-bottom:6px}
.fine{font-size:.88rem;color:var(--muted);margin-top:10px}
.resume{background:var(--mark);color:var(--mark-d);border-radius:10px;padding:14px 16px;margin-bottom:18px}
.resume p{margin-bottom:10px}
.resume .row{display:flex;flex-wrap:wrap;gap:8px}
.resume .btn{border-color:var(--mark-d);color:var(--mark-d);background:transparent}
.resume .btn.primary{background:var(--mark-d);color:var(--mark)}
.blueprint h2{font:700 1.3rem var(--font-read);margin-bottom:14px}
.sp{display:grid;gap:10px}
.sp-g{display:flex;align-items:center;gap:12px}
.sp-l{width:4.4rem;flex:none;font-size:.85rem;color:var(--muted)}
.sp-c{display:flex;gap:6px;flex-wrap:wrap}
.dot{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-weight:700;font-size:.85rem}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:16px 0 10px}
.lg li{display:flex;align-items:center;gap:8px;font-size:.92rem}
.lg i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.mix{border-top:1px solid var(--line);margin-top:6px}
.mix div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.mix dd{font-weight:700;white-space:nowrap}
.blueprint .btn{margin-top:16px}
.rules{margin-top:40px;max-width:72ch}
.rules h2{font:700 1.3rem var(--font-read);margin-bottom:12px}
.rules ul{display:grid;gap:10px;padding-left:1.2em;list-style:disc}

/* ===== Layar ujian ===== */
.exam{display:flex;flex-direction:column;height:100vh;height:100dvh;--fs:1}
.bar{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 16px;background:var(--ink);color:#fff}
.bar .ttl{flex:1;min-width:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .who{max-width:22ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.fsz{display:flex;gap:4px}
.fsz button{min-width:40px;height:36px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:8px;font-weight:700}
.fsz button:hover{background:rgba(255,255,255,.16)}
.fsz button:disabled{opacity:.35;cursor:not-allowed}
.clock{font-variant-numeric:tabular-nums;font-weight:750;font-size:1.2rem;padding:5px 12px;border-radius:8px;background:rgba(255,255,255,.16);min-width:5.6ch;text-align:center}
.clock.warn{background:var(--mark);color:var(--mark-d)}
.clock.danger{background:#fff;color:var(--bad)}
.timeline{height:4px;background:var(--ink-d)}
.timeline i{display:block;height:100%;width:0;background:var(--mark)}
.tabs{display:none}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;padding:18px}
.sheet,.qpane{min-height:0;overflow:auto}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:26px clamp(18px,3vw,40px) 44px;font-family:var(--font-read);font-size:calc(1.06rem * var(--fs));line-height:1.75;box-shadow:0 14px 30px -24px rgba(13,33,89,.6)}
.sheet:focus{outline:none}
.qpane{padding:2px 6px 28px 2px;font-size:calc(1rem * var(--fs))}

.range{font:650 .8rem/1.3 var(--font-ui);color:var(--muted);margin-bottom:14px}
.part+.part{margin-top:30px;padding-top:22px;border-top:1px solid var(--line-2)}
.part-label{display:inline-block;font:700 .78rem/1.6 var(--font-ui);background:var(--ink);color:#fff;padding:0 12px;border-radius:999px;margin-bottom:10px}
.ptitle{font:700 1.4em/1.25 var(--font-read);margin-bottom:16px}
.para{position:relative;padding-left:2.5em;margin-bottom:1em}
.pn{position:absolute;left:0;top:.42em;width:1.65em;height:1.65em;border:1.5px solid var(--line);border-radius:50%;font:650 .68em/1.6em var(--font-ui);text-align:center;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin:12px 0}
table.data{border-collapse:collapse;width:100%;font-family:var(--font-ui);font-size:.92em;line-height:1.4}
table.data caption{text-align:left;font-weight:650;padding-bottom:8px;color:var(--muted)}
table.data th,table.data td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.data thead th{background:var(--ink-l)}
table.data tbody th{font-weight:600;background:#f5f7f6}

.q-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:10px}
.q-no{font:700 1.55em var(--font-read)}
.q-of{color:var(--muted)}
.q-form{margin-left:auto;font-size:.82em;font-weight:650;color:var(--ink);background:var(--ink-l);padding:2px 10px;border-radius:999px}
.q-text{font:600 1.08em/1.55 var(--font-read);margin-bottom:12px}
.q-hint{font-size:.92em;font-weight:650;color:var(--ink);background:var(--ink-l);border-left:4px solid var(--ink);padding:6px 10px;margin-bottom:14px}

.opt{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:2px solid var(--line-2);border-radius:12px;padding:12px 14px;margin:0 0 10px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--ink)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.bub{flex:none;display:grid;place-items:center;width:2.1em;height:2.1em;border:2px solid var(--muted);border-radius:50%;background:#fff;color:var(--text);font-weight:700;font-size:.95em}
.mc .bub,.bub.sq{border-radius:8px}
.otxt{padding-top:.22em;line-height:1.5}
.opt.on{border-color:var(--ink);background:var(--ink-l)}
.opt.on .bub{background:var(--ink);border-color:var(--ink);color:#fff}
.opt input:focus-visible + .bub,.pill input:focus-visible + span{box-shadow:0 0 0 3px var(--ink)}

.kat{display:grid;gap:10px}
.kat-row{margin:0;min-width:0;background:var(--paper);border:2px solid var(--line-2);border-radius:12px;padding:12px 14px}
.kat-s{display:flex;gap:10px;margin-bottom:10px;line-height:1.5}
.kat-n{flex:none;font-weight:700;color:var(--ink)}
.kat-ch{display:flex;gap:8px;flex-wrap:wrap}
.pill{position:relative;flex:1 1 120px;min-width:110px;text-align:center;border:2px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:650;background:#fff}
.pill:hover{border-color:var(--ink)}
.pill input{position:absolute;opacity:0;width:1px;height:1px}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}

.nav{display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.nav .grow{flex:1}
.flagbtn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:2px solid var(--line);border-radius:10px;background:#fff;font-weight:650;white-space:nowrap}
.flagbtn .chk{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center}
.flagbtn[aria-pressed="true"]{background:var(--mark);border-color:var(--mark-b);color:var(--mark-d)}
.flagbtn[aria-pressed="true"] .chk{background:var(--mark-d);border-color:var(--mark-d)}
.flagbtn[aria-pressed="true"] .chk::after{content:"";width:9px;height:5px;border-left:2.5px solid var(--mark);border-bottom:2.5px solid var(--mark);transform:rotate(-45deg) translate(1px,-1px)}

/* ===== Modal dan panel daftar soal ===== */
.overlay{position:fixed;inset:0;background:rgba(13,33,89,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.right{justify-content:flex-end;align-items:stretch;padding:0}
.modal{background:var(--paper);border-radius:14px;max-width:560px;width:100%;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal.wide{max-width:1000px}
.drawer{background:var(--paper);width:min(430px,100%);height:100%;display:flex;flex-direction:column;overflow:hidden}
.drawer-body{flex:1;min-height:0;overflow:auto;padding:20px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.mh h2{font:700 1.35rem var(--font-read)}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center}
.x:hover{border-color:var(--ink)}
.lead{margin-bottom:12px;line-height:1.55}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:16px;font-size:.9rem}
.legend li{display:flex;align-items:center;gap:8px}
.lgroup{margin-bottom:16px}
.lgroup h3{font-size:.95rem;margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
.lgroup h3 span{font-weight:400;color:var(--muted);font-size:.88rem}
.cells{display:flex;flex-wrap:wrap;gap:8px}
.cell{width:44px;height:44px;border-radius:50%;border:2px solid var(--muted);background:#fff;color:var(--text);font-weight:700;display:inline-grid;place-items:center;padding:0}
.cell.done{background:var(--ink);border-color:var(--ink);color:#fff}
.cell.partial{background:var(--ink-l);border:2px dashed var(--ink);color:var(--ink)}
.cell.flagged{box-shadow:0 0 0 4px var(--mark)}
.cell.cur{outline:3px solid var(--ink);outline-offset:3px}
.cell.sm{width:18px;height:18px;border-width:2px}
.cell.r-benar{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.r-sebagian{background:var(--part-l);border-color:var(--part);color:var(--part)}
.cell.r-salah{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.r-kosong{background:#fff;border-color:var(--muted);color:var(--muted)}
.mf{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.drawer .mf{margin:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line-2)}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0 16px}
.tally div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tally dt{font-size:.85rem;color:var(--muted)}
.tally dd{font-weight:750;font-size:1.5rem;font-variant-numeric:tabular-nums}
.modal .tbl-wrap{margin-top:14px}
.subhead{font:700 1.1rem var(--font-read);margin:20px 0 8px}
.subhead:first-of-type{margin-top:4px}
.bp td,.bp th{font-size:.9rem}

.toast-root{position:fixed;left:0;right:0;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--ink-d);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);max-width:min(92vw,520px)}

/* ===== Hasil ===== */
.result{max-width:1000px;margin:0 auto;padding:clamp(16px,3vw,40px) clamp(14px,3vw,28px) 80px}
.res-top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.res-top h1{font:700 clamp(1.8rem,4vw,2.6rem)/1.1 var(--font-read)}
.res-top .who{font-weight:650;margin-top:8px}
.res-top .when{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.banner{background:var(--mark);color:var(--mark-d);font-weight:650;padding:10px 14px;border-radius:8px;margin-bottom:16px}
.score{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:24px;display:grid;grid-template-columns:auto 1fr;gap:20px 40px;align-items:center}
.score-num{font:700 clamp(3.6rem,10vw,5.6rem)/1 var(--font-read);color:var(--ink);font-variant-numeric:tabular-nums}
.score-cap{font-weight:650;margin-top:6px}
.score-sub{color:var(--muted);font-size:.95rem}
.score-meta dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.score-meta dl div{border-left:4px solid var(--c,var(--line));padding-left:10px}
.score-meta dt{font-size:.85rem;color:var(--muted)}
.score-meta dd{font-weight:750;font-size:1.4rem;font-variant-numeric:tabular-nums}
.strip{grid-column:1/-1;border-top:1px solid var(--line-2);padding-top:18px}
.strip .cells{gap:6px}
.strip .cell{width:38px;height:38px;font-size:.88rem;text-decoration:none}
.strip .lg{margin:14px 0 0}
.strip .lg i{border-radius:50%;width:14px;height:14px;background:var(--c);border:2px solid var(--c)}
.strip .lg i.line{background:#fff;border:2px solid var(--muted)}
@media (max-width:700px){.score{grid-template-columns:1fr}}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
@media (max-width:820px){.breakdown{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px}
.panel h2{font:700 1.2rem var(--font-read);margin-bottom:14px}
.bar-row{margin-bottom:14px}
.bar-row:last-child{margin-bottom:0}
.bar-l{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;font-size:.95rem}
.bar-l span:first-child{font-weight:650}
.bar-l span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:12px;background:var(--line-2);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--ink));border-radius:999px}
details.sub{margin-top:18px}
details.sub summary{cursor:pointer;font-weight:650;color:var(--ink);padding:6px 0}
.advice{margin-top:18px;background:var(--ink-l);border-left:6px solid var(--ink);border-radius:4px;padding:16px 18px}
.advice h2{font:700 1.15rem var(--font-read);margin-bottom:6px}

.review{margin-top:34px}
.rv-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.rv-bar h2{font:700 1.6rem var(--font-read)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:9px 14px;font-weight:650;color:var(--ink);min-height:42px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.rv-set{margin-bottom:28px}
.rv-sh{margin-bottom:12px}
.rv-sh h3{font:700 1.25rem var(--font-read)}
.rv-sh > p{color:var(--muted);margin-top:2px}
.rv-text{margin-top:8px}
.rv-text summary{cursor:pointer;font-weight:650;color:var(--ink);padding:6px 0}
.sheet.inline{overflow:visible;margin-top:8px;box-shadow:none}
.rv-item{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--muted);border-radius:6px;padding:18px 20px;margin-bottom:14px}
.rv-item[data-status="benar"]{border-left-color:var(--ok)}
.rv-item[data-status="sebagian"]{border-left-color:var(--part)}
.rv-item[data-status="salah"]{border-left-color:var(--bad)}
.rv-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:10px}
.rv-no{font:700 1.5rem var(--font-read);margin-right:2px}
.badge{font-size:.82rem;font-weight:700;padding:2px 10px;border-radius:999px}
.b-benar{background:var(--ok-l);color:var(--ok)}
.b-sebagian{background:var(--part-l);color:var(--part)}
.b-salah{background:var(--bad-l);color:var(--bad)}
.b-kosong{background:#eceff0;color:var(--muted)}
.pt{font-size:.85rem;color:var(--part);font-weight:600}
.chip{font-size:.82rem;font-weight:650;color:#fff;background:var(--c);padding:2px 10px;border-radius:999px}
.subtag{font-size:.85rem;color:var(--muted)}
.flagmark{font-size:.82rem;font-weight:700;background:var(--mark);color:var(--mark-d);padding:2px 10px;border-radius:999px}
.rv-item .q-text{margin-bottom:12px}
.ro-list{display:grid;gap:8px}
.ro{display:flex;gap:12px;align-items:flex-start;padding:9px 12px;border:2px solid var(--line-2);border-radius:10px;background:#fbfcfb}
.ro .bub{font-size:.85rem}
.ro-b{min-width:0}
.ro.key{border-color:var(--ok);background:var(--ok-l)}
.ro.key .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.ro.bad{border-color:var(--bad);background:var(--bad-l)}
.ro.bad .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.tags{display:flex;gap:6px;margin-top:4px}
.tag{font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:999px;background:#fff;border:1.5px solid var(--muted);color:var(--text)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.me{border-color:var(--ink);color:var(--ink)}
.note{font-size:.92rem;color:var(--muted);margin-top:4px;line-height:1.45}
.why{margin-top:14px;padding:12px 14px;background:var(--ink-l);border-radius:8px;line-height:1.55}
.kat-rv td,.kat-rv th{font-size:.95rem}
.kat-rv tr.ok td:last-child{background:var(--ok-l);font-weight:650}
.kat-rv tr.bad td:last-child{background:var(--bad-l);font-weight:650}
.kat-rv tr.none td:last-child{background:#eceff0;color:var(--muted)}
.kat-rv td:first-child p+p{margin-top:4px}
.kat-rv .note{color:var(--muted)}
.review[data-filter="review"] .rv-item[data-status="benar"]{display:none}
.review[data-filter="flag"] .rv-item[data-flag="0"]{display:none}
.rv-empty{padding:16px;border:2px dashed var(--line);border-radius:10px;color:var(--muted);display:none}
.review.is-empty .rv-empty{display:block}

/* ===== Layar sempit (ponsel dan tablet tegak) ===== */
@media (max-width:899px){
  .bar{padding:6px 12px;gap:8px}
  .bar .who{display:none}
  .tabs{display:flex;background:var(--paper);border-bottom:1px solid var(--line)}
  .tabs button{flex:1;min-height:46px;border:0;background:none;font-weight:650;border-bottom:3px solid transparent}
  .tabs button[aria-selected="true"]{border-bottom-color:var(--ink);color:var(--ink)}
  .workspace{display:block;overflow:auto;padding:12px}
  .exam[data-tab="text"] .qpane{display:none}
  .exam[data-tab="question"] .sheet{display:none}
  .sheet,.qpane{overflow:visible}
  .sheet{padding:20px 14px 32px;line-height:1.7}
  .para{padding-left:2.1em}
  .qpane{padding:0 0 20px}
  .nav{gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  .toast-root{bottom:76px}
}
@media (max-width:640px){
  .nav{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px}
  .nav .grow{display:none}
  .nav .btn{padding:0 10px;min-width:44px}
  .flagbtn{justify-content:center;gap:8px;padding:0 8px;min-width:0;font-size:.95rem}
  .flagbtn .chk{width:18px;height:18px}
  .nav .lbl-x{display:none}
  .facts{gap:10px 24px}
}
@media (max-width:400px){
  #btn-next svg{display:none}
}

/* ===== Cetak ===== */
@media print{
  body{background:#fff}
  .noprint,.tabs,.toast-root{display:none!important}
  .result{max-width:none;padding:0}
  .rv-item,.panel,.score{break-inside:avoid;border-color:#999}
  .review[data-filter] .rv-item{display:block!important}
  .rv-text{display:none}
  .why{background:#f1f3f8}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    var first = $('[data-autofocus]', modalRoot) || $('button, [href], input', modalRoot);
    if (first) first.focus();
  }
  function closeModal() {
    modalRoot.innerHTML = '';
    document.body.classList.remove('has-modal');
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
    lastFocus = null;
  }
  function modalOpen() { return !!modalRoot.firstChild; }
  function toast(msg, ms) {
    var el = document.createElement('div');
    el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
    toastRoot.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, ms || 3200);
  }

  /* ---------- timer ---------- */
  function startTimer() {
    stopTimer();
    var left = S.endsAt - Date.now();
    [600, 300, 60].forEach(function (s) { if (left <= s * 1000) warned[s] = true; });
    tick();
    timerId = setInterval(tick, 500);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function tick() {
    if (!S || S.finished || ui.view !== 'exam') { stopTimer(); return; }
    var total = CONFIG.durationMinutes * 60000, left = S.endsAt - Date.now();
    if (left <= 0) { finish(true); return; }
    var clock = $('#clock');
    if (clock) {
      clock.textContent = clockText(left);
      clock.className = 'clock' + (left <= 300000 ? ' danger' : (left <= 600000 ? ' warn' : ''));
    }
    var tl = $('#tl');
    if (tl) tl.style.width = Math.min(100, (1 - left / total) * 100) + '%';
    [600, 300, 60].forEach(function (s) {
      if (left <= s * 1000 && !warned[s]) { warned[s] = true; toast('Sisa waktu ' + (s / 60) + ' menit.', 4200); }
    });
  }

  function finish(auto) {
    if (!S || S.finished) return;
    S.finished = true;
    S.timedOut = !!auto;
    S.finishedAt = Math.min(Date.now(), S.endsAt);
    save(); stopTimer(); closeModal();
    ui.view = 'result';
    render();
    if (auto) toast('Waktu habis. Jawaban Anda sudah dikumpulkan.', 6000);
  }

  /* ---------- render utama ---------- */

  }

  /* ---------- halaman awal ---------- */

  function resumeCard(s) {

  /* ---------- layar ujian ---------- */
  function tableHTML(t) {
    var h = '<div class="tbl-wrap"><table class="data"><caption>' + esc(t.caption) + '</caption><thead><tr>';
    t.head.forEach(function (c) { h += '<th scope="col">' + esc(c) + '</th>'; });

    t.rows.forEach(function (r) {
      h += '<tr>';
      r.forEach(function (c, i) { h += (i === 0 ? '<th scope="row">' : '<td>') + esc(c) + (i === 0 ? '</th>' : '</td>'); });
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }
  function stimulusHTML(id) {
    var st = ST[id], g = groupInfo(id);

    st.parts.forEach(function (p) {

      h += '<h2 class="ptitle">' + esc(p.title) + '</h2>';

      if (p.table) h += tableHTML(p.table);
      h += '</article>';
    });
    return h;
  }

      h += '<div class="kat">';
      q.stmts.forEach(function (s, k) {

        q.cats.forEach(function (c, ci) {
          h += '<label class="pill' + (v === ci ? ' on' : '') + '"><input type="radio" name="k' + q.n + '_' + k + '" value="' + ci + '" data-k="' + k + '"' + (v === ci ? ' checked' : '') + '><span>' + esc(c) + '</span></label>';
        });
        h += '</div></fieldset>';
      });
      h += '</div>';

        h += '<label class="opt' + (on ? ' on' : '') + '"><input type="' + (multi ? 'checkbox' : 'radio') + '" name="q' + q.n + '" value="' + oi + '"' + (on ? ' checked' : '') + '><span class="bub">' + LETTERS[pos] + '</span><span class="otxt">' + esc(q.opts[oi]) + '</span></label>';

  function renderExam() {
    var h = '<div class="exam" id="exam" data-tab="' + ui.tab + '">';

    h += '<div class="fsz" role="group" aria-label="Ukuran huruf"><button type="button" id="fs-dec" data-act="fs-" aria-label="Perkecil huruf">A−</button><button type="button" id="fs-inc" data-act="fs+" aria-label="Perbesar huruf">A+</button></div>';

    h += '<button type="button" class="btn primary" id="btn-next" data-act="next"><span id="next-txt">Berikutnya</span>' + ICON_R + '</button>';
    h += '</footer></div>';
    app.innerHTML = h;
    applyFs();
    paintExam();
    startTimer();
  }
  function applyFs() {
    var ex = $('#exam');
    if (ex) ex.style.setProperty('--fs', FS_STEPS[Math.max(0, Math.min(FS_STEPS.length - 1, S.fs))]);
  }
  function paintExam() {
    var q = Q[S.cur], st = $('#stimulus'), qp = $('#qpane'), ws = $('.workspace');
    if (st.getAttribute('data-set') !== q.set) { st.innerHTML = stimulusHTML(q.set); st.setAttribute('data-set', q.set); st.scrollTop = 0; }
    qp.innerHTML = questionHTML(S.cur);
    qp.scrollTop = 0;
    if (ws) ws.scrollTop = 0;
    $('#exam').setAttribute('data-tab', ui.tab);
    updateNav();
  }
  function updateNav() {
    var q = Q[S.cur], last = S.cur === Q.length - 1, done = 0;
    $('#btn-prev').disabled = S.cur === 0;
    $('#btn-next').setAttribute('data-act', last ? 'finish-ask' : 'next');
    $('#next-txt').textContent = last ? 'Selesai tes' : 'Berikutnya';
    $('#btn-flag').setAttribute('aria-pressed', S.flags[q.n] ? 'true' : 'false');
    Q.forEach(function (x) { if (status(x) === 'done') done++; });
    $('#prog').textContent = done + '/' + Q.length;
    var clr = $('#btn-clear'); if (clr) clr.disabled = status(q) === 'empty';
    $('#tab-text').setAttribute('aria-selected', ui.tab === 'text' ? 'true' : 'false');
    $('#tab-question').setAttribute('aria-selected', ui.tab === 'question' ? 'true' : 'false');
    $('#fs-dec').disabled = S.fs <= 0;
    $('#fs-inc').disabled = S.fs >= FS_STEPS.length - 1;
  }
  function goTo(i) {
    i = Math.max(0, Math.min(Q.length - 1, i));
    var prevSet = Q[S.cur].set;
    S.cur = i;
    ui.tab = Q[i].set !== prevSet ? 'text' : 'question';
    save(); paintExam();
    window.scrollTo(0, 0);
  }

  /* jawaban */
  function toggleMC(q, val, on) {
    var a = (S.answers[q.n] || []).slice(), i = a.indexOf(val);
    if (on && i < 0) a.push(val);
    if (!on && i >= 0) a.splice(i, 1);
    a.sort(function (x, y) { return x - y; });
    if (a.length) S.answers[q.n] = a; else delete S.answers[q.n];
  }
  function setKat(q, k, val) {
    var a = (S.answers[q.n] || []).slice();
    while (a.length < q.stmts.length) a.push(null);
    a[k] = val;
    S.answers[q.n] = a;
  }

  function cellHTML(i) {

  /* ---------- hasil dan pembahasan ---------- */
  function barRow(label, color, got, n) {

  }
  function optReview(q, a) {
    var multi = q.form === 'MCMA', keys = multi ? q.key : [q.key], mine = multi ? (a || []) : (a == null ? [] : [a]);
    var h = '<ol class="ro-list">';
    orderOf(q).forEach(function (oi, pos) {
      var isKey = keys.indexOf(oi) >= 0, isMine = mine.indexOf(oi) >= 0;
      var cls = 'ro' + (isKey ? ' key' : '') + (isMine && !isKey ? ' bad' : '');
      var tags = '';
      if (isKey) tags += '<span class="tag ok">Kunci</span>';
      if (isMine) tags += '<span class="tag me">Jawabanmu</span>';
      h += '<li class="' + cls + '"><span class="bub' + (multi ? ' sq' : '') + '">' + LETTERS[pos] + '</span><div class="ro-b"><p>' + esc(q.opts[oi]) + '</p>' +
        (tags ? '<p class="tags">' + tags + '</p>' : '') +
        (q.notes && q.notes[oi] ? '<p class="note">' + esc(q.notes[oi]) + '</p>' : '') + '</div></li>';
    });
    return h + '</ol>';
  }
  function katReview(q, a) {
    var h = '<div class="tbl-wrap"><table class="data kat-rv"><thead><tr><th>Pernyataan</th><th>Kunci</th><th>Jawabanmu</th></tr></thead><tbody>';
    q.stmts.forEach(function (s, k) {
      var v = a ? a[k] : null, cls = (v !== 0 && v !== 1) ? 'none' : (v === q.key[k] ? 'ok' : 'bad');
      h += '<tr class="' + cls + '"><td><p>' + (k + 1) + '. ' + esc(s) + '</p>' + (q.notes && q.notes[k] ? '<p class="note">' + esc(q.notes[k]) + '</p>' : '') + '</td><td>' + esc(q.cats[q.key[k]]) + '</td><td>' + ((v === 0 || v === 1) ? esc(q.cats[v]) : 'Kosong') + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  }
  function reviewItem(it) {
    var q = it.q, a = S.answers[q.n], fl = !!S.flags[q.n];
    var badge = { benar: 'Benar', sebagian: 'Sebagian benar', salah: 'Salah', kosong: 'Tidak dijawab' }[it.status];
    var h = '<article class="rv-item" id="rv' + q.n + '" data-status="' + it.status + '" data-flag="' + (fl ? 1 : 0) + '">';
    h += '<header class="rv-h"><span class="rv-no">' + q.n + '</span><span class="badge b-' + it.status + '">' + badge + '</span>';
    if (it.status === 'sebagian') h += '<span class="pt">skor ' + fmt2(it.frac) + ' dari 1</span>';
    h += '<span class="chip" style="--c:' + COMPS[q.comp].color + '">' + esc(COMPS[q.comp].name) + '</span><span class="subtag">' + esc(q.sub) + ' ' + esc(SUBS[q.sub]) + '</span>';
    if (fl) h += '<span class="flagmark">Ragu-ragu</span>';
    h += '</header><p class="q-text">' + esc(q.q) + '</p>';
    h += q.form === 'KAT' ? katReview(q, a) : optReview(q, a);
    h += '<div class="why"><strong>Pembahasan.</strong> ' + esc(q.why) + '</div></article>';
    return h;
  }
  function reviewHTML(R) {
    var h = '<section class="review" id="review" data-filter="all"><div class="rv-bar noprint"><h2>Pembahasan</h2><div class="seg" role="group" aria-label="Saring soal">';
    h += '<button type="button" class="on" data-act="filter" data-filter="all">Semua</button><button type="button" data-act="filter" data-filter="review">Perlu ditinjau</button><button type="button" data-act="filter" data-filter="flag">Ragu-ragu</button></div></div>';
    SET_IDS.forEach(function (id) {
      var g = groupInfo(id), st = ST[id];
      h += '<div class="rv-set" data-set="' + id + '"><header class="rv-sh"><h3>Teks ' + setNo(id) + ': ' + esc(st.parts[0].title) + '</h3><p>' + esc(st.genre) + ', level ' + esc(st.level) + ', soal ' + g.a + ' s.d. ' + g.b + '.</p>';
      h += '<details class="rv-text noprint"><summary>Tampilkan teks</summary><div class="sheet inline">' + stimulusHTML(id) + '</div></details></header>';
      for (var i = g.first; i <= g.last; i++) h += reviewItem(R.items[i]);
      h += '</div>';
    });
    h += '<p class="rv-empty">Tidak ada soal pada saringan ini.</p></section>';
    return h;
  }
  function renderResult() {
    stopTimer();
    var R = compute(S), used = (S.finishedAt || Date.now()) - S.startedAt;
    var label = R.pct >= 85 ? 'Sangat baik' : R.pct >= 70 ? 'Baik' : R.pct >= 55 ? 'Cukup' : 'Perlu latihan lagi';
    var h = '<div class="result"><header class="res-top"><div><h1>Hasil simulasi</h1><p class="who">' + esc(S.name) + (S.klass ? ', ' + esc(S.klass) : '') + '</p><p class="when">' + esc(dateText(S.startedAt)) + (CONFIG.school ? ', ' + esc(CONFIG.school) : '') + '</p></div>';
    h += '<div class="actions noprint"><button type="button" class="btn primary" data-act="copy">Salin ringkasan</button><button type="button" class="btn" data-act="print">Cetak atau simpan PDF</button><button type="button" class="btn" data-act="restart">Ulangi simulasi</button></div></header>';
    if (S.timedOut) h += '<p class="banner">Waktu pengerjaan habis. Jawaban yang sudah terisi dikumpulkan otomatis.</p>';
    h += '<section class="score"><div><div class="score-num">' + fmt1(R.pct) + '</div><p class="score-cap">' + label + '</p><p class="score-sub">' + fmt1(R.total) + ' dari ' + Q.length + ' poin. Waktu terpakai ' + durText(used) + ' dari ' + CONFIG.durationMinutes + ' menit.</p></div>';
    h += '<div class="score-meta"><dl><div style="--c:var(--ok)"><dt>Benar</dt><dd>' + R.cnt.benar + '</dd></div><div style="--c:var(--part)"><dt>Sebagian</dt><dd>' + R.cnt.sebagian + '</dd></div><div style="--c:var(--bad)"><dt>Salah</dt><dd>' + R.cnt.salah + '</dd></div><div style="--c:var(--muted)"><dt>Tidak dijawab</dt><dd>' + R.cnt.kosong + '</dd></div></dl></div>';
    h += '<div class="strip"><div class="cells">';
    R.items.forEach(function (it) { h += '<a class="cell r-' + it.status + '" href="#rv' + it.q.n + '" title="Soal ' + it.q.n + ': ' + it.status + '">' + it.q.n + '</a>'; });
    h += '</div><ul class="lg noprint"><li><i style="--c:var(--ok)"></i>Benar</li><li><i style="--c:var(--part)"></i>Sebagian</li><li><i style="--c:var(--bad)"></i>Salah</li><li><i class="line"></i>Tidak dijawab</li></ul></div></section>';

    h += '<div class="breakdown"><section class="panel"><h2>Per kompetensi</h2>';
    ['T', 'I', 'E'].forEach(function (k) { var b = R.byComp[k]; if (b) h += barRow(COMPS[k].name, COMPS[k].color, b.got, b.n); });
    h += '</section><section class="panel"><h2>Per bentuk soal</h2>';
    ['PG', 'MCMA', 'KAT'].forEach(function (k) { var b = R.byForm[k]; if (b) h += barRow(FORM_SHORT[k], 'var(--ink)', b.got, b.n); });
    h += '</section></div>';

    h += '<details class="sub panel"><summary>Rincian per subkompetensi</summary><div class="tbl-wrap"><table class="data"><thead><tr><th>Kode</th><th>Subkompetensi</th><th>Soal</th><th>Capaian</th></tr></thead><tbody>';
    Object.keys(SUBS).forEach(function (k) {
      var b = R.bySub[k];
      if (b) h += '<tr><td>' + k + '</td><td>' + esc(SUBS[k]) + '</td><td>' + b.n + '</td><td>' + Math.round(b.got / b.n * 100) + '%</td></tr>';
    });
    h += '</tbody></table></div></details>';

    var low = null;
    ['T', 'I', 'E'].forEach(function (k) { var b = R.byComp[k]; if (!b) return; var p = b.got / b.n * 100; if (!low || p < low.p) low = { k: k, p: p }; });
    h += '<section class="advice"><h2>Saran latihan</h2><p>';
    if (low && low.p < 85) h += 'Prioritas: <strong>' + esc(COMPS[low.k].name) + '</strong> (' + Math.round(low.p) + '%). ' + esc(ADVICE[low.k]);
    else h += 'Capaian sudah merata pada ketiga kompetensi. Lanjutkan dengan teks yang lebih panjang atau dengan waktu yang lebih singkat.';
    h += '</p></section>';

    if (CONFIG.showReview) h += reviewHTML(R);
    h += '</div>';
    app.innerHTML = h;
  }
  function summaryText() {
    var R = compute(S), used = (S.finishedAt || Date.now()) - S.startedAt, L = [];
    L.push('SIMULASI TKA BAHASA INGGRIS');
    if (CONFIG.school) L.push(CONFIG.school);
    L.push('Nama: ' + S.name + (S.klass ? ' (' + S.klass + ')' : ''));
    L.push('Tanggal: ' + dateText(S.startedAt));
    L.push('Nilai: ' + fmt1(R.pct) + ' dari 100 (' + fmt1(R.total) + ' dari ' + Q.length + ' poin)');
    L.push('Waktu terpakai: ' + durText(used) + ' dari ' + CONFIG.durationMinutes + ' menit');
    L.push('Benar ' + R.cnt.benar + ', sebagian ' + R.cnt.sebagian + ', salah ' + R.cnt.salah + ', tidak dijawab ' + R.cnt.kosong);
    L.push('Kompetensi: ' + ['T', 'I', 'E'].map(function (k) { var b = R.byComp[k]; return COMPS[k].name + ' ' + Math.round(b.got / b.n * 100) + '%'; }).join(', '));
    L.push('Kode jawaban (PG = huruf; MCMA = huruf terpilih; kategori = 1 atau 2 per pernyataan; - = kosong):');
    L.push(Q.map(function (q) { return q.n + ':' + answerCode(q); }).join(' '));
    return L.join('\n');
  }
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? 'Ringkasan hasil disalin.' : 'Tidak bisa menyalin otomatis. Ambil tangkapan layar hasil ini.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Ringkasan hasil disalin.'); }, fallback);
    } else fallback();
  }
  function applyFilter(mode) {
    var rv = $('#review'); if (!rv) return;
    rv.setAttribute('data-filter', mode);
    $$('.seg button', rv).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-filter') === mode); });
    var any = false;
    $$('.rv-set', rv).forEach(function (set) {
      var vis = false;
      $$('.rv-item', set).forEach(function (it) {
        var st = it.getAttribute('data-status'), fl = it.getAttribute('data-flag') === '1';
        var show = mode === 'all' || (mode === 'review' && st !== 'benar') || (mode === 'flag' && fl);
        if (show) vis = true;
      });
      set.style.display = vis ? '' : 'none';
      if (vis) any = true;
    });
    rv.classList.toggle('is-empty', !any);
  }

  /* ---------- event ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    switch (act) {
      case 'overlay': if (e.target === el) closeModal(); break;
      case 'close': closeModal(); break;
      case 'blueprint': openModal(blueprintHTML(), 'wide'); break;
      case 'resume': {
        var sv = loadSaved(); if (!sv) break;
        S = sv; warned = {};
        if (!S.finished && S.endsAt <= Date.now()) { S.finished = true; S.timedOut = true; S.finishedAt = S.endsAt; save(); }
        ui.view = S.finished ? 'result' : 'exam'; ui.tab = 'text'; render();
        break;
      }
      case 'show-result': {
        var sr = loadSaved(); if (!sr) break;
        S = sr; ui.view = 'result'; render();
        break;
      }
      case 'discard':
        openModal('<div class="mh"><h2>Hapus sesi tersimpan?</h2></div><p class="lead">Jawaban dan hasil sesi ini akan dihapus dari peramban ini dan tidak bisa dikembalikan.</p><div class="mf"><button type="button" class="btn" data-act="close" data-autofocus>Batal</button><button type="button" class="btn primary" data-act="discard-now">Ya, hapus</button></div>');
        break;
      case 'discard-now': store.del(CONFIG.storageKey); S = null; closeModal(); ui.view = 'start'; render(); break;
      case 'prev': if (S.cur > 0) goTo(S.cur - 1); break;
      case 'next': if (S.cur < Q.length - 1) goTo(S.cur + 1); break;
      case 'go': closeModal(); goTo(Number(el.getAttribute('data-go'))); break;
      case 'flag': {
        var fq = Q[S.cur];
        if (S.flags[fq.n]) delete S.flags[fq.n]; else S.flags[fq.n] = true;
        save(); updateNav();
        break;
      }
      case 'clear': {
        var cq = Q[S.cur];
        delete S.answers[cq.n]; save();
        var qp = $('#qpane'), top = qp.scrollTop; qp.innerHTML = questionHTML(S.cur); qp.scrollTop = top;
        updateNav();
        break;
      }
      case 'list': openModal(listHTML(), 'drawer'); break;
      case 'fs-': if (S.fs > 0) { S.fs--; save(); applyFs(); updateNav(); } break;
      case 'fs+': if (S.fs < FS_STEPS.length - 1) { S.fs++; save(); applyFs(); updateNav(); } break;
      case 'tab': {
        ui.tab = el.getAttribute('data-tab');
        $('#exam').setAttribute('data-tab', ui.tab);
        var ws = $('.workspace'); if (ws) ws.scrollTop = 0;
        updateNav();
        break;
      }
      case 'finish-ask': askFinish(); break;
      case 'finish-now': finish(false); break;
      case 'copy': copyText(summaryText()); break;
      case 'print': window.print(); break;
      case 'restart':
        openModal('<div class="mh"><h2>Ulangi simulasi?</h2></div><p class="lead">Hasil sesi ini akan dihapus dari peramban ini. Salin ringkasan hasil lebih dulu jika masih diperlukan.</p><div class="mf"><button type="button" class="btn" data-act="close" data-autofocus>Batal</button><button type="button" class="btn primary" data-act="discard-now">Ya, ulangi</button></div>');
        break;
      case 'filter': applyFilter(el.getAttribute('data-filter')); break;
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!S || ui.view !== 'exam' || !t || t.tagName !== 'INPUT') return;
    var q = Q[S.cur];
    if (q.form === 'PG') {
      S.answers[q.n] = Number(t.value);
      $$('#qpane .opt').forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); });
    } else if (q.form === 'MCMA') {
      toggleMC(q, Number(t.value), t.checked);
      var lab = t.closest('.opt'); if (lab) lab.classList.toggle('on', t.checked);
    } else {
      setKat(q, Number(t.getAttribute('data-k')), Number(t.value));
      var row = t.closest('.kat-row');
      if (row) $$('.pill', row).forEach(function (p) { p.classList.toggle('on', p.querySelector('input').checked); });
    }
    save(); updateNav();
  });

  document.addEventListener('submit', function (e) {
    if (!e.target || e.target.id !== 'startForm') return;
    e.preventDefault();
    var name = $('#f-name').value.trim(), klass = $('#f-class').value.trim(), err = $('#f-err');
    err.textContent = '';
    if (!name) { err.textContent = 'Isi nama peserta terlebih dahulu.'; $('#f-name').focus(); return; }
    if (CONFIG.token) {
      var tk = ($('#f-token').value || '').trim().toUpperCase();
      if (tk !== String(CONFIG.token).trim().toUpperCase()) { err.textContent = 'Token tidak sesuai. Minta token kepada pengawas.'; $('#f-token').focus(); return; }
    }
    S = newSession(name, klass); warned = {}; save();
    ui.view = 'exam'; ui.tab = 'text'; render();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalOpen()) { closeModal(); return; }
    if (ui.view !== 'exam' || !S || modalOpen()) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'TEXTAREA') return;
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && tag !== 'INPUT') {
      e.preventDefault();
      if (e.key === 'ArrowRight' && S.cur < Q.length - 1) goTo(S.cur + 1);
      if (e.key === 'ArrowLeft' && S.cur > 0) goTo(S.cur - 1);
      return;
    }
    if (e.key && e.key.length === 1) {
      var idx = LETTERS.indexOf(e.key.toUpperCase()), q = Q[S.cur];
      if (idx >= 0 && q.form !== 'KAT') { var inp = $$('#qpane .opt input')[idx]; if (inp) inp.click(); }
    }
  });

  window.addEventListener('beforeunload', function (e) {
    if (S && !S.finished && ui.view === 'exam') { e.preventDefault(); e.returnValue = ''; return ''; }
  });

  document.addEventListener('visibilitychange', function () { if (!document.hidden && ui.view === 'exam') tick(); });

  /* ---------- mulai ---------- */
  document.title = CONFIG.title;
  render();
})();

</script>
</body>
</html>
